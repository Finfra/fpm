# fbot 아이콘 카탈로그 — 사람 편집 가능.
# 형식: {role}: shape=<도형> base=<#hex> label=<한글> tags=<t1|t2> [origin=<출처>] [origin_seen=<epoch>] [kind=tool] [status=archived] [manager=true] [nonexec=true] [checker=true] [engine=<엔진>] [permission_mode=floor|bypass]
# checker·engine·permission_mode (prj3#Issue859_1 — _doc_arch/fbot-org.md §선언 확장): checker=true = 검증 직능(검증선 checked_by 대상 ·
#   향후 선택 판정 agent.checker 후보 — selection-arch.md). engine = 그 직능이 판정을 맡기는 모델, 열거값 claude|codex|agy 만
#   ('|' 다값, 부재 = claude — origin 은 출처라 엔진 파생에 쓰지 않는다). permission_mode = 직능 권한 기본값(부재 = bypass,
#   floor 로 바꾸는 것은 사람 결정 H:보안). 해석 단일 지점: fbot-org.py role_engines·is_checker·role_permission_default
# nonexec (prj3#Issue757): 일을 하지 않고 시키기만 하는 관리직(총괄·팀장) — 배분 채널(지휘 지시문)·환기·
#   인박스 발신 제한·사람 창구의 판정 단일 지점(fbot-org.is_nonexec). 쓰기 가드는 역할별 축(권한·분업)으로 따로 가른다. manager(명령 수신 — hr 포함)와 다른 축이다.
# 도형 어휘: star shield hexagon triangle grid check magnifier magnet frame speech venn tag compass wrench broom
# origin (prj3#Issue589) (prj3#Issue833): agent:N | agent:P/N(prj P 로컬 agent — prj3#Issue1062) | skill:N | plugin:M/N | command:N | hook:N | web:URL | native — 복수는 '|'.
#   ⚠️ 값에 공백·따옴표 불가(파서가 split() 기준). 쓰기는 훅 경유만 — 직접 Edit 금지.
#   origin_seen = drift 판정 기준선(원본을 본 시각). 매뉴얼 mtime 을 기준선으로 쓰지 않는다.
# kind (prj3#Issue636): tool = «도구 래핑» 재분류 — 봇 계층 배분을 기대하지 않는다(배분 0 이
#   정상). 부재 = bot(기본). 기입은 fbot-scout.py set-kind. 엔트리 삭제 금지 — 지우면 같은
#   승격이 반복된다. 배분 자체는 막지 않는다(lead dispatch --role R 은 그대로 산다).

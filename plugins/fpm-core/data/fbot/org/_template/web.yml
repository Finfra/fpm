# 조직 템플릿 — web (prj3#Issue538)
#
# general + 리서치·크리에이티브. 웹은 산출이 외부에 노출되므로 조사(선례·경쟁)와
# 시각 산출물의 비중이 높다.
depts:
  - id: dev
    label: 개발부서
    seats:
      - { id: dev-architect-1, role: architect, reports_to: ops-lead-1 }
      - { id: dev-planner-1,   role: planner, reports_to: ops-lead-1 }
      # 구현 자리 (prj3#Issue757 T3) — 없으면 팀장이 배분할 곳이 없어 직접 수행한다(solo «자리 없음» 56건).
      #   최소셋 원칙의 예외가 아니다: 구현은 모든 prj 가 쓰는 일이라 공석이 곧 결원 신호다
      - { id: dev-developer-1, role: developer, reports_to: ops-lead-1 }
  - id: review
    label: 리뷰부서
    seats:
      - { id: rev-qa-1,         role: qa, reports_to: ops-lead-1 }
      - { id: rev-crosscheck-1, role: crosscheck, reports_to: ops-lead-1 }
  - id: research
    label: 리서치부서
    seats:
      - { id: rsc-research-1, role: research, reports_to: ops-lead-1 }
  - id: creative
    label: 크리에이티브부서
    seats:
      - { id: crt-graphic-1, role: graphic, reports_to: ops-lead-1 }
  - id: ops
    label: 운영부서
    seats:
      - { id: ops-lead-1, role: lead, reports_to: hq/hq-lead-1 }
      - { id: ops-release-1,   role: release, reports_to: ops-lead-1 }

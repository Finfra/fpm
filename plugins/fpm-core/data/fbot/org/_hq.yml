# 본사 조직 — 상비 4종 + 매뉴얼핀봇 (prj3#Issue538 · prj3#Issue757)
#
# 게이트 3종(chief·hr·scout)은 **전역 단일**이다. 보고 창구가 갈리면 "단일 보고" 목적이
# 무너지고, 인사·발굴은 게이트 SSOT 라 복수화가 곧 판정 분열이다(fbot-arch §조직).
# 그래서 본사는 프로젝트 조직도에 뜨지 않고 `?tab=org` 전체 뷰에서만 보인다.
#
# ⚠️ 여기서 "전역"은 **prj 축**이다. 머신이 갈리면 개체도 갈린다(나래@jm4 / 미르@fg1).
prj: null
title: 본사
machine: jm4
# prj3#Issue734 — 본사 개체(prj=NULL)가 인박스 요청으로 깨어날 때 몸체(tmux 창)를 여는 prj.
#   Agent 형태는 발신 세션의 자식이라 n:1 창구가 성립하지 않는다. prj3(~/.claude, fbot 코드 소재지) — 사용자 확정 2026-09-27
body_prj: 3
depts:
  - id: hq
    label: 본사
    seats:
      # reports_to = 선언 보고선 (prj3#Issue550). `/` 없으면 같은 조직 안의 자리,
      #   있으면 절대 주소(`{scope}/{seat}`)다. 총괄이 루트이므로 chief 에는 없다.
      - { id: hq-chief-1,     role: chief }
      # 인사·발굴의 보고선은 본사 팀장이다(prj3#Issue831 ②) — 총괄 ↔ 인사·발굴 인박스는 양방향 거부(Issue757 개정 F)라
      #   보고를 실제로 받는 것은 본사 팀장이다. 보고선 ≠ 인력 확보 주체 — 조직 단 인력 확보(차용·생성)는 여전히 총괄 몫
      - { id: hq-hr-1,       role: hr,      reports_to: hq-lead-1 }
      - { id: hq-scout-1,  role: scout, reports_to: hq-lead-1 }
      - { id: hq-lead-1,  role: lead, reports_to: hq-chief-1 }
      # 매뉴얼핀봇 (prj3#Issue757 T12) — 매뉴얼 개정 **본문**을 쓰는 손. 총괄은 일을 하지 않으므로 결정(apply/reject)만
      #   하고, 본문 작성 배분은 본사 팀장이 한다 — 그래서 총괄이 아니라 본사 팀장 아래다
      - { id: hq-manual-1, role: manual, reports_to: hq-lead-1 }

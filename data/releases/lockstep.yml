# lockstep.yml — 릴리스 버전 정합 **선언** SSOT (V4 / prj3 감사 F5)
#
# ⚠️ 글로벌 SCAR 변경 가드: cwd ≠ ~/_git/___pm 이면 즉흥 수정 금지.
#   검증기: scripts/fpm-lockstep-check.sh · 마스터 현황: _doc_arch/fapp-version.md
#
# 왜 (감사 v1.0.3 X3):
#   2026-07 에 prj16(1.1.0) ↔ prj26(1.1.1) 이 어긋난 것을 발견했다. 고치는 것만으로는
#   부족하다 — **게이트가 없으면 다음 릴리스에 그대로 재발한다.**
#   다만 무엇이 "어긋남" 인지는 쌍마다 다르므로, 강제하지 않고 **선언한 것만 검증**한다.
#
# ⚠️ 전부를 강제하지 않는 이유 (fWarrange 설계결정 4)
#   paidApp ↔ cliApp 은 **레포·배포 채널·릴리스 주기가 독립**이다(App Store vs Homebrew).
#   patch 가 갈리는 것은 정상이고, 사용자 혼란만 막으면 된다 → 기본 정합 수준은 `minor`.
#   `exact` 를 쓰려면 그 쌍이 정말 같은 배포 단위인지 먼저 확인할 것.
#
# level
#   exact  x.y.z 전부 일치해야 한다 (같은 배포 단위)
#   minor  x.y 까지 일치하면 된다   (독립 채널 — patch 는 갈려도 무방)
#   none   검증하지 않는다          (선언만 남기고 게이트는 끔)

pairs:
  - name: fSnippet
    level: minor
    members:
      - { prj: 15, path: ~/_git/__all/fSnippet, role: paidApp }
      - { prj: 25, path: ~/_git/__all/fSnippet/_public, role: cliApp }

  - name: fWarrange
    level: minor
    members:
      - { prj: 16, path: ~/_git/__all/fWarrange, role: paidApp }
      - { prj: 26, path: ~/_git/__all/fWarrange/_public, role: cliApp }

# 축 분리 규약 (X3(c), 2026-07-31 — 여기서는 선언만, 집행은 각 repo deploy.sh)
#   MARKETING_VERSION      = VERSION 파일 (x.y.z, 사람 기준점)
#   CURRENT_PROJECT_VERSION = 정수 리터럴, 업로드마다 +1
#   두 값이 같아지면 배포 중단 — App Store 가 업로드마다 유일 빌드번호를 요구하기 때문이다.
axis_separation:
  required_for: [15, 16]        # App Store 제출 대상(paidApp). brew 전용은 빌드번호가 무의미
  todo: [11, 12, 13, 14]        # 🚧 종전 CPV=MV 유지 — 각 앱 다음 제출 시 전환

# ─────────────────────────────────────────────────────────────────────────
# 릴리스 트레인 (V7, 2026.08.01) — 파일은 **릴리스 때 만든다**
#
# 이 폴더에 `{YYYY.MM.DD}.yml` 로 "이번에 함께 나가는 것" 을 기록한다.
# lockstep.yml 과 관심사가 다르다 —
#   lockstep.yml : 쌍의 **정합 수준 선언**(영속, 매 배포 검증)
#   {날짜}.yml   : 그 릴리스에 **무엇이 함께 나갔는가**(1회성 기록)
#
# ⚠️ 빈 껍데기를 미리 만들지 않는다. 2026.08.01 실측상 릴리스 태그가 0개라
#    기록할 트레인 자체가 없었다. 첫 릴리스 때 아래 형태로 만든다:
#
#   date: 2026.08.15
#   trigger: fSnippet 1.2.0 App Store 제출
#   members:
#     - { prj: 15, version: 1.2.0, channel: app-store, tag: v1.2.0 }
#     - { prj: 25, version: 1.2.0, channel: homebrew,  tag: cli-v1.2.0 }
#   notes: cliApp 은 paidApp 승인 후 배포(순서 의존)

# doc-base.yml — 이 프로젝트의 **문서 추적 선언** (2축)
#   판정 SSOT: _doc_arch/gitignore-policy.md
#     축1 `_doc_base/`  — "# `_doc_base/` 예외 — 명시 선언 규칙" (Issue477)
#     축2 docs 6항목    — "# docs 예외 — 명시 선언 규칙"        (Issue497)
#   검사: bash sh/doc-base-check.sh [<repo>]
#
# ⚠️ 두 축은 **기본값이 반대**다. 위험이 반대이기 때문이다 —
#   _doc_base 의 위험은 «유출» 이라 닫은 채 시작하고(deny),
#   docs 의 위험은 «유실» 이라 연 채 시작한다(track).

# _doc_base/ (원천자료: 매뉴얼 소스·미공개 사양·배경조사)
#   allow = git 추적 (버전이력·원격백업 확보 · 유출면을 아는 상태에서 연다)
#   deny  = gitignore (유출 방지 · ⚠️ git 백업이 없으므로 Time Machine 등 별도 보호 필요)
tracking: deny

# docs 6항목 (.claude/ · CLAUDE.md · Issue.md · _doc_arch/ · _doc_work/ · noteForHuman.md)
#   track  = git 추적 (기본값 · 원장과 설계를 git 이 보호한다)
#   ignore = 로컬 전용 (⚠️ 버전이력·원격백업 0 — data/template/gitignore 의 docs 블록 주석 해제 필요)
docs: track

# allow / ignore 를 택했으면 이유를 남긴다 (다음 사람이 판단 근거를 읽는 유일한 자리)
reason: ""

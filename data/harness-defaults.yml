# harness-defaults.yml — 타입별 Harness.md global layer 기본값 SSOT (Issue499)
#
# 왜 여기 있나: 종전에는 이 목록이 `pm/SKILL.md` 산문 안에만 있었고, 템플릿은
#   *"동일 타입의 기존 프로젝트에서 자동 수집하여 초기 채움"* 이라고 **약속만** 했다.
#   그 수집을 하는 코드가 없어 집행자가 기억해서 손으로 하거나 하지 않았고,
#   그래서 프로젝트마다 Harness.md 가 빈 골격으로 남았다.
#   ⇒ 목록을 기계가 읽는 자리로 옮기고 `sh/fpm-scaffold-fill.py` 가 집행한다.
#
# 소비처: sh/fpm-scaffold-fill.py (유일) · 문서 참조: .claude/skills/pm/SKILL.md
# 갱신 규칙: 도메인 SCAR 를 늘리면 여기만 고친다. SKILL.md 에 목록을 다시 적지 않는다.

general:
  skills:   [dev-g, issue-g, capture-g]
  commands: [/issue-reg-g, /issue-fix-g, /issue-closer-g]
  agents:   []
  rules:    []

web:
  skills:   [dev-g, dev-w, issue-g, issue-w, capture-g, capture-w]
  commands: [/issue-reg-w, /issue-fix-w, /issue-closer-w]
  agents:   []
  rules:    []

mac:
  skills:   [dev-g, dev-m, issue-g, issue-m, capture-g, capture-m, deploy-m, version-manager-m]
  commands: [/issue-reg-m, /issue-fix-m, /issue-closer-m]
  agents:   []
  rules:    []

# scar-manifest.yml — fpm SCAR 설치/제거/업데이트 통합 SSOT (Issue240)
#
# SCAR 가 다른 머신/서버로 배포되는 두 경로(플러그인 · 플랫파일)와 셸 부트스트랩
# 아티팩트를 한 곳에 모은 단일 진실 원본. install.sh · update.sh · uninstall.sh ·
# remove.sh(to-be) · remote.sh(to-be) · publish-scar.sh · check.sh 가 본 파일을 참조한다.
#
# 본 yml 이 SSOT. data/install_manifest.sh(bash, installer 무의존용)는 본 파일에서
# sh/gen-install-manifest.sh 로 생성되는 파생물이다 — install_manifest.sh 를 직접 손대지 말고
# 본 파일을 고친 뒤 생성기를 재실행하라. 상세: data/scar-manifest.md
#
# 배경(버그): 원격 서버 배포(flat_file 경로)의 rsync 가이드가 과거 `--delete` 를 쓰지
#   않아, 소스에서 rename·삭제된 SCAR 파일이 원격 ~/.claude/ 에 orphan 으로 잔존했다
#   ("파일을 지우지 못하는 현상"). flat_file.rsync_delete: true + protect[] 가 해법.
#
# 규약:
#   - 경로 기준점은 키 접미사로 명시: *_rel_home = $HOME 기준 / *_rel_repo = repo 루트 기준.
#   - 값만 선언. 로직(생성·검증·삭제)은 소비 스크립트가 담당.
#   - 파서 무의존 원칙: 생성기(gen-install-manifest.sh)는 python3 만 사용(yq 불필요).

meta:
  schema_version: 1
  issue: Issue240
  description: SCAR 설치/제거/업데이트 통합 SSOT — 플러그인 + 플랫파일 + 셸 아티팩트

# ── 셸 부트스트랩 아티팩트 (두 페이로드 공통 전제) ───────────────────────────
shell:
  # rc 블록 마커 (install: 삽입 가드 / check: 존재 확인 / uninstall: 제거 범위)
  rc_marker: "# >>> fpm functions >>>"
  rc_marker_end: "# <<< fpm functions <<<"
  # FPM_BASE 베이스경로 기록 파일 ($HOME 기준)
  basepath_rel_home: ".info/__pmBasePath.txt"
  # 부트스트랩 source 대상 (repo 기준)
  bootstrap_rel_repo: "sh/fpm.sh"
  # projects/ 스캐폴드 — 필수 존재 인덱스 (check 가 검증; 0=$HOME, 1=$REPO)
  scaffold_indexes: [0, 1]
  # 운영 필수 파일 (real:org, repo 기준) — install: org 존재+real 부재 시 복사(멱등)
  #
  # sections (선택, Issue407): 실파일이 **이미 있어도** 여기 헤딩이 하나도 없으면 org 에서
  #   그 섹션 블록만 이식한다. 파일 통째 덮어쓰기가 아니라 결손 섹션 append 이므로 사용자
  #   데이터는 보존된다. 구버전 org 로 설치된 사본이 이후 템플릿 보강을 영영 못 받던 결함
  #   (fg1 실측: `# Project Map` 부재 → Projects_map 빌더 rc=1 → 맵 통째 미생성) 대응.
  #   목록 **첫 항목이 삽입 정본**, 나머지는 "이미 있음" 으로 인정할 구표기 별칭.
  #   별칭 집합은 build_projects_map.py 의 TREE_HEADINGS 와 같은 값을 유지할 것.
  org_files:
    - real: Servers.md
      org: Servers_org.md
    - real: Projects.md
      org: Projects_org.md
      sections: ["# Project Map", "# Project Tree", "# 프로젝트 트리"]
    - real: data/hub_setting.yml
      org: data/hub_setting_org.yml
    - real: data/editor.yml
      org: data/editor_org.yml

  # 프로젝트 맵 산출물 (repo 기준, Issue407) — install: 부재 시 빌더 1회 실행.
  #   빌더는 htm 과 같은 이름의 .md 를 함께 쓴다(둘은 한 실행의 두 출력).
  #   경로는 hub server.py PROJECTS_MAP_BUILDER/PROJECTS_MAP_NAME 과 같은 값을 유지할 것.
  projects_map:
    builder_rel_repo: ".claude/skills/projects-map/build_projects_map.py"
    out_rel_repo: "Projects_map.htm"

# ── 배포 페이로드 (두 경로) ──────────────────────────────────────────────────
payloads:

  # 경로 1: Claude Code 플러그인 (prj20 집약 마켓 경유). 로컬 머신 표준 설치.
  #   install  : marketplace add(중복 update) → plugin install(중복 skip)
  #   update   : marketplace update → plugin update
  #   uninstall: plugin uninstall (marketplace 는 공유 — 제거 금지)
  #   삭제 의미: `claude plugin (un)install/update` 가 플러그인 디렉토리 전체를 교체하므로
  #            소스에서 빠진 SCAR 는 자동 정리됨 → 본 경로엔 orphan 잔존 문제가 없다.
  plugin:
    enabled: true
    src_rel_repo: plugins/fpm-core
    marketplace:
      name: f-claude-plugins
      ref_default: https://github.com/Finfra/f-claude-plugins   # env FPM_MKT_REF 로 override
      shared: true            # 공유 마켓 — fQRGen·fBanner 등 타 플러그인과 공유. remove 금지(cascade).
    plugin_name: fpm-core
    # 번들 SCAR 인벤토리 (선언적 drift 가드). plugin.json 은 개별 SCAR 를 열거하지 않으므로
    #   "fpm-core 가 무엇을 ship 하는가" 의 진실 원본은 본 목록. check.sh 가 소스 파일과 양방향 대조.
    #   파일 규약: commands/<name>.md · skills/<name>/SKILL.md · agents/<name>.md
    scar:
      commands:
        - fpm-cdf
        - fpm-board
        - fpm-board-server
        - fpm-do                # 구 fpm-pm-do 커맨드의 현재 이름 (스킬 fpm-pm-do 는 별도 존속)
        - fpm-hub
        - fpm-hub-server
        - fpm-issue-map
        - fpm-new-project
        - fpm-pm-del
        - fpm-pm-new
        - fpm-pm-query
        - fpm-pm-update
        - fpm-show
      skills:
        - fbot-icon             # 핀봇 아이콘 카탈로그+결정론 SVG 생성기 (prj3#Issue436)
        - fpm-cdf
        - fpm-issue-map
        - fpm-pm
        - fpm-pm-do
      agents:
        - fpm-board
      # hooks (Issue412) — 다른 3종과 **파일 규약이 다르다**: `commands/<name>.md` 같은
      #   확장자 규약이 없고 `hooks/<파일명 그대로>` 다. 그래서 확장자를 포함해 적는다.
      #   이 목록이 "번들이 무엇을 ship 하는가" 의 SSOT — 종전엔 선언이 아예 없어서
      #   **번들에서 훅이 사라져도 아무 신호가 없었다**(2026-08-29 실측: fbot-heartbeat.sh 를
      #   지우고 fpm-bundle-sync.sh --check 를 돌리면 "표류 없음"). 그 훅을 hooks.json 이
      #   참조하고 있어도 배포본에서 파일만 빠져 소비자 런타임에서 깨진다.
      hooks:
        - dispatch-sessionend.sh
        - dispatch-sessionstart.sh
        - fbot-agent-bind.sh
        - fbot-board-init.sh
        - fbot-board-monitor.sh
        - fbot-checkin.sh
        - fbot-checkout.sh
        - fbot-exec-report.py
        - fbot-heartbeat.sh
        - fbot-hr-gate.py
        - fbot-manual-review.py
        - fbot-schedule.sh
        - fbot-state.py
        - fbot-taskmgr.py
        - fbot-tick.sh
        - fbot-worker-plist.sh
        - fbot-worker-unit.sh
        - fpm-ask-form-template.js
        - fpm-ask-intercept.sh
        - fpm-ask-marker-detect.sh
        - fpm-ask-question-guard.sh
        - fpm-board-notify.sh
        - fpm-browser-open.sh
        - fpm-hub-doc-register.sh
        - fpm-hub-session-end.sh
        - fpm-hub-session-register.sh
        - fpm-hub-session-topic.sh
        - fpm-hub-trigger.sh
        - hooks.json
    # ── hooks 정본 판정 (Issue412 ①, 2026-08-29) ─────────────────────────────
    #   **정본은 prj3(`~/.claude/hooks/`) 이고 번들은 사본이다.** 근거:
    #     ① 이름 일치 27건이 **전건 내용 일치**이고 prj3 가 상위집합(prj3 전용 45건)
    #     ② 동기 코드가 이미 그렇게 돼 있다 — scripts/fpm-bundle-sync.sh 의
    #        `sync_dir_by_name "$BUNDLE/hooks" "$GLOBAL/hooks"` 가 prj3 를 src 로 잡는다
    #     ③ flat_file 페이로드도 같은 `origin_rel_home` 규약을 쓴다(구조 일관)
    #   ⚠️ `src_rel_repo: plugins/fpm-core` 와 모순되지 않는다 — 그 키는 *"무엇을 배포하는가"*
    #      (페이로드 소스)이고, 아래는 *"어디서 저작되는가"*(저작 원본)다. 두 개념이 한 키에
    #      겹쳐 보였던 것이 Issue412 가 "선언과 실운영이 어긋난다" 고 본 이유다.
    hooks_origin_rel_home: ".claude/hooks"
    # 번들 전용 훅 — prj3 에 대응 원본이 **없는 것이 정상**인 배포 전용 자산.
    #   여기 없는데 원본에도 없으면 orphan(폐기된 훅의 잔재)이다. 종전엔 이 판정 근거가
    #   fpm-bundle-sync.sh **주석**에만 있어 기계가 읽지 못했다(Issue412 ④).
    hooks_bundle_only:
      - fpm-browser-open.sh   # 배포 전용 브라우저 오픈 헬퍼 (prj1 저작)
      - hooks.json            # 플러그인 훅 등록 매니페스트 — 번들 고유 산출물

  # 경로 2: 원격 서버 ~/.claude 플랫파일 배포 (고객/타 서버 — claude CLI 플러그인 미가용 환경).
  #   install/update: rsync src → dest, rsync_delete: true 로 orphan prune (★ 버그 해법)
  #   remove(to-be) : files[] 를 dest 기준으로 정밀 삭제, protect[] 는 보존
  #   가이드: data/claude_forNewServer.md (사람용 설치 절차)
  flat_file:
    enabled: true
    src_rel_repo: data/claude_forNewServer       # 끝 슬래시는 소비 스크립트가 rsync 시 부여
    dest_rel_home: .claude
    rsync_delete: true        # ★ orphan prune. false 면 소스에서 지운 파일이 원격에 잔존(=원 버그).
    # 사본의 원본 (prj3 글로벌 SCAR). files[] 는 이 경로 기준으로도 해석된다 —
    #   즉 <origin_rel_home>/<file> 을 <src_rel_repo>/<file> 로 복사한 것이 사본이다.
    #   재생성·표류검사: sh/scar-flatfile-sync.sh (Issue388). 단방향 prj3 → prj1, prj3 는 읽기 전용.
    origin_rel_home: ".claude"
    # 정밀 삭제·검증·dry-run 용 전체 인벤토리 (src_rel_repo 기준 상대경로).
    #   rsync_delete 가 자동 prune 하지만, remove.sh(to-be) 가 selective 삭제할 때 본 목록을 사용.
    #   SCAR 추가·삭제·rename 시 본 목록을 함께 갱신해야 drift 가 안 생긴다.
    #   ⚠️ 경로는 **원본(prj3)의 현재 실제 위치**를 그대로 쓴다. 사본에서 임의로 평탄화하면
    #      함께 배포되는 CLAUDE.md 의 상대 링크가 대상 서버에서 죽는다(Issue388 실측 원인).
    files:
      - CLAUDE.md
      - Harness.md
      - commands/design-doc.md
      - commands/issue-closer-g.md
      - commands/issue-fix-g.md
      - commands/issue-reg-g.md
      - commands/md-add.md
      - commands/needs.md
      - rules/info-files.md
      - rules/issue-g.md
      - rules/language-rules.md
      - rules/naming-rules.md
      - rules/opus-4-8-execution-rules.md
      - _doc_arch/rules-ondemand/change-detect-rules.md
      - _doc_arch/rules-ondemand/md-rules.md
      - _doc_arch/rules-ondemand/nptir-rules.md
      - _doc_arch/rules-ondemand/refs-rules.md
      - skills/dev-g/SKILL.md
      - skills/dev-w/SKILL.md
      - skills/doc-work-archive/SKILL.md
      - skills/git/SKILL.md
      - skills/git/scripts/git_wrapper.sh
      - skills/issue-g/SKILL.md
      - skills/issue-w/SKILL.md
    # rsync --delete / remove.sh 가 dest 에서 절대 지우면 안 되는 대상 서버 사용자 데이터.
    #   rsync 에는 --exclude 로, remove.sh 에는 skip 패턴으로 전달. dest_rel_home 기준 glob.
    protect:
      - "Issue.md"
      - "projects/"
      - "_doc_work/"
      - "_doc_arch/"
      - "settings.json"
      - "settings.local.json"
      - "memory/"
      - "*.local.*"
    # protect 보다 **우선하는** 반출 경로 (rsync: --include 를 --exclude 앞에 배치).
    #   조건부 로드 룰 4종이 rules/ → _doc_arch/rules-ondemand/ 로 이동했는데(prj3 조건부 로드 재편)
    #   protect 가 `_doc_arch/` 를 통째로 막고 있어, 예외가 없으면 배포에서 조용히 누락되고
    #   함께 나가는 CLAUDE.md 의 조건부 로드 표가 전부 죽은 링크가 된다.
    #   protect 의 본래 의도는 "대상 서버가 스스로 쓴 _doc_arch 문서를 보존"이므로,
    #   우리가 ship 하는 rules-ondemand/ 하위만 예외로 두는 것이 의도에 부합한다.
    protect_exceptions:
      - "_doc_arch/rules-ondemand/"

# ── 소비 스크립트 계약 (어느 스크립트가 무엇을 읽는가) ────────────────────────
#   문서화 전용(스크립트가 파싱하지 않음). 상세 계약은 data/scar-manifest.md.
consumers:
  - script: sh/install.sh
    reads: [shell, payloads.plugin]
    note: 셸 부트스트랩 + 플러그인 설치(멱등). install_manifest.sh(파생) 경유.
  - script: sh/update.sh
    reads: [payloads.plugin]
    note: git pull(셸) + marketplace/plugin update. install_manifest.sh(파생) 경유.
  - script: sh/uninstall.sh
    reads: [shell, payloads.plugin]
    note: 셸 블록 제거 + plugin uninstall. marketplace(shared) 보존.
  - script: sh/publish-scar.sh
    reads: [payloads.plugin]
    note: 소스 → 마켓 발행(rsync --delete). install_manifest.sh(파생) 경유.
  - script: sh/check.sh
    reads: [shell, payloads.plugin, payloads.flat_file]
    note: 설치 검증 + SCAR drift 대조. install_manifest.sh(파생) 경유. 항목11=선언↔사본,
          항목12=사본↔prj3 원본(scar-flatfile-sync.sh --check 위임, Issue388),
          항목12-2=번들 hooks 3방향(scar-hooks-check.sh 위임, Issue412).
  - script: sh/scar-hooks-check.sh
    reads: [payloads.plugin]
    note: 번들 hooks/ 3방향 대조(선언↔디스크↔prj3 원본). **검사 전용** — 동기는
          scripts/fpm-bundle-sync.sh 가 유일한 writer 이므로 두 번째 writer 를 만들지 않는다(Issue412).
          yml 직독(파생물 미경유 — scar-flatfile-sync.sh 와 같은 이유).
  - script: scripts/fpm-bundle-sync.sh
    reads: []
    note: yml 을 읽지 않는다(경로 하드코딩). 번들 hooks/commands/agents/services 의 유일한 writer.
          위 checker 가 이 스크립트를 조치 경로로 지목하므로 함께 적어 둔다.
  - script: sh/scar-flatfile-sync.sh
    reads: [payloads.flat_file]
    note: 사본(src_rel_repo) 을 원본(origin_rel_home) 에서 재생성 + --check 표류 게이트.
          yml 직독(파생물 미경유 — 매니페스트 갱신 직후 파생물 생성기가 아직 실패하는 구간이 있음).
  - script: remote.sh        # to-be (Issue240 범위 외)
    reads: [payloads.flat_file]
    note: 원격 서버 ~/.claude 플랫파일 배포. rsync_delete + protect 적용.
  - script: remove.sh        # to-be (Issue240 범위 외)
    reads: [payloads.flat_file]
    note: 원격/로컬 ~/.claude 에서 flat_file.files 정밀 삭제. protect 보존.

# 머신 명부 — fpm 이 실제로 도는 곳 (Issue430)
#   platform 값은 sh/fpm_function.sh 의 `_fpm_platform` 과 같은 어휘를 쓴다:
#   macos | linux | wsl | windows
#   ⚠️ 호스트명·경로는 적지 않는다 — 공개 미러로 나가는 파일이다.

machines:
  - id: authoring
    platform: macos
    role: 저작 정본 (prj1·prj3 개발, 마켓 발행)
    status: active

  - id: gpu-server
    platform: linux
    role: 소비자 · 원격 검증 (플러그인 설치본 + repo pull)
    status: active
    notes: |
      nvm 으로 node 도구를 깐다 — hook·cron 에서 PATH 에 안 잡힌다(prj3#Issue475).
      ~/.claude 가 플러그인 설치본이라 repo 구조가 없다(Issue428).

  - id: laptop
    platform: macos
    role: 소비자
    status: active

  - id: win-pc
    platform: windows
    role: 소비자 · 원격 검증 (Windows 10 · Git Bash)
    status: active
    notes: |
      셸 실측(2026.10.21): ssh 로그인 셸은 cmd, 실행 셸은 Git Bash(MSYS_NT-10.0 — `uname -s`).
      cmd 의 `bash` 는 WSL 스텁이라 Git Bash 를 풀경로로 부르고 스크립트는 stdin 으로 보낸다.
      Git Bash 의 /tmp 는 scp 에게 C:/Users/…/Temp 다 — `cygpath -m` 으로 변환한다. clone 은 core.autocrlf=input (W1).
      개발자 모드 미설정이라 symlink-support 는 «추적 심링크 0건» 일 때만 ok (windows-port.md W2).

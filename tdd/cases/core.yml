# 전 플랫폼 공통 — 어디서든 통과해야 하는 것 (Issue430)
#   여기 있는 것은 대부분 **실제로 깨진 적이 있다**. why 에 이슈 번호를 남긴다.

cases:
  - id: platform-detect
    desc: 플랫폼을 정규화된 1단어로 판정한다
    why: |
      uname -s 원문은 분기에 쓰기 나쁘다 — Windows 는 셸에 따라 MINGW64_NT /
      MSYS_NT / CYGWIN_NT 로 갈리고 WSL 은 그냥 Linux 다.
    run: |
      . "$REPO_DIR/sh/fpm_function.sh" 2>/dev/null
      _fpm_platform
    expect: nonempty

  - id: date-parse-iso
    desc: ISO 시각을 epoch 로 파싱한다
    why: |
      prj3#Issue476 — date -j 는 BSD 전용이라 GNU date 에서 실패하고,
      `|| echo 0` 이 0 을 내놓아 "1970년" 이 된다. due <= now 판정이
      영원히 성립하지 않는데 로그에는 아무 흔적도 없었다.
    run: |
      DATE=/bin/date
      "$DATE" -j -f '%Y-%m-%dT%H:%M:%S' '2026-01-02T03:04:05' +%s 2>/dev/null \
        || "$DATE" -d '2026-01-02T03:04:05' +%s 2>/dev/null
    expect: nonzero-epoch

  - id: date-offset-days
    desc: N일 뒤 날짜를 계산한다
    why: |
      date -v 도 BSD 전용이다. aoa-mq 의 `--due +Nd` 와 snooze 가 이걸 쓴다.
    run: |
      date -v '+3d' '+%Y-%m-%d' 2>/dev/null || date -d '+3 days' '+%Y-%m-%d' 2>/dev/null
    expect: nonempty

  - id: repo-relative-resolve
    desc: 실행체가 자기 위치 기준으로 짝을 찾는다
    why: |
      Issue428 — hub 가 ~/.claude/mcp/… 홈 절대경로만 봐서 소비자 머신에서
      tick 타이머가 통째로 미기동했다. 저작 머신은 ~/.claude 가 곧 repo 라
      드러나지 않았다.
    run: |
      test -f "$REPO_DIR/mcp/aoa-mq/aoa-mq-tick.sh" && echo found
    expect: contains:found

  - id: python3-available
    desc: python3 가 있고 표준 모듈을 읽는다
    why: hook·빌더 다수가 python3 를 전제한다. Windows 는 python 만 있는 경우가 있다.
    run: |
      python3 -c 'import json,sqlite3,urllib.request; print("ok")' 2>/dev/null \
        || python -c 'import json,sqlite3,urllib.request; print("ok")' 2>/dev/null
    expect: contains:ok

  - id: python-resolver-picks
    desc: 인터프리터 해석 SSOT 가 쓸 수 있는 후보를 고른다
    why: |
      Issue436 — 설치기가 제각각 `command -v python3` 를 쓰다 스텁을 실물로 잡았다.
      해석은 sh/fbot-python.sh 한 곳이 담당한다. 그 헬퍼 자체가 도는지부터 본다.
    run: |
      . "$REPO_DIR/sh/fbot-python.sh"
      fbot_resolve_python sqlite3 && "${FBOT_PY_ARGV[@]}" -c 'print("ok")'
    expect: contains:ok

  - id: python-resolver-rejects-stub
    desc: 실행되지 않는 `python3`(MS Store 스텁)를 걸러내고 다음 후보로 넘어간다
    why: |
      Issue436 실체 — Windows 의 `python3` 는 존재하는데 rc=49 로 죽는 리디렉터 스텁이다.
      `command -v` 만 보면 통과시킨 뒤 실행에서 죽는다. 여기서는 그 스텁을 **재현**해
      PATH 앞에 두고, 해석기가 사유와 함께 탈락시키는지 본다.
      ⚠️ 이 케이스가 없으면 W4 회귀는 Windows 실기에서만 드러난다.
    run: |
      . "$REPO_DIR/sh/fbot-python.sh"
      _d="$(mktemp -d)"; trap 'rm -rf "$_d"' EXIT
      printf '#!/bin/sh\nexit 49\n' > "$_d/python3"; chmod +x "$_d/python3"
      _real="$(command -v python3 || command -v python)"
      printf '#!/bin/sh\nexec %s "$@"\n' "$_real" > "$_d/python"; chmod +x "$_d/python"
      PATH="$_d:$PATH" bash -c '. "$0/sh/fbot-python.sh"
        fbot_resolve_python || exit 1
        case "$FBOT_PY_REJECT" in *"python3(실행 불가)"*) echo rejected ;; *) echo "MISS:$FBOT_PY_REJECT" ;; esac
        "${FBOT_PY_ARGV[@]}" -c "print(\"ok\")"' "$REPO_DIR"
    expect: contains:rejected

  - id: mcp-registration-validated
    desc: 깨진 MCP 등록(스크립트 부재)을 무효로 판정한다
    why: |
      Issue436 ⓒ — 설치기가 "이미 등록됨 — 보존" 만 해서 한 번 깨진 등록이 재설치로도
      낫지 않았다. jm4 실측: repo 이전으로 server.py 가 사라졌는데 등록만 남아
      aoa-memory 가 CONNECTION_CLOSED 였다. 유효한 등록은 그대로 둬야 한다.
    run: |
      . "$REPO_DIR/sh/fbot-python.sh"
      fbot_resolve_python >/dev/null || exit 1
      _py="${FBOT_PY_ARGV[0]}"
      fbot_registration_valid "$_py" "$REPO_DIR/mcp/aoa-mq/server.py" && printf 'valid '
      fbot_registration_valid "$_py" "$REPO_DIR/mcp/nosuch/server.py" || printf 'invalid'
    expect: contains:valid invalid

  - id: git-available
    desc: git 이 있고 이 디렉토리가 워크트리다
    why: 배포 체인 전체가 git 위에 선다.
    run: |
      git -C "$REPO_DIR" rev-parse --is-inside-work-tree 2>/dev/null
    expect: contains:true

  - id: jq-available
    desc: jq 가 있다
    why: aoa-mq 큐 조작이 jq 로 원자 갱신한다. 없으면 조용히 갱신 실패한다.
    run: |
      command -v jq >/dev/null && echo ok
    expect: contains:ok

  - id: mcp-server-present
    desc: MCP 서버(aoa-mq·aoa-memory)가 repo 안에 있다
    why: |
      Issue431 — MCP 서버는 **플러그인 번들에 실리지 않는다.** 마켓 발행본에
      mcp/ 디렉토리가 아예 없고, 소비자의 ~/.claude.json 은 repo 경로를
      직접 가리킨다(fg1 실측: ~/_git/fpm/mcp/aoa-mq/server.py).
      "prj20 에서 배포되니 repo mcp/ 는 지워도 된다" 는 **사실이 아니다** —
      지우면 소비자의 예약 큐·메모리가 즉시 죽는다. 이행이 끝날 때까지
      이 케이스가 그 사실을 붙잡아 둔다.
    run: |
      test -f "$REPO_DIR/mcp/aoa-mq/server.py" \
        && test -f "$REPO_DIR/mcp/aoa-memory/server.py" && echo ok
    expect: contains:ok

  - id: hub-tick-resolvable
    desc: hub 가 tick 스크립트를 자기 위치 기준으로 찾는다
    why: |
      Issue428 — ~/.claude/mcp/… 홈 절대경로만 보다가 소비자 머신에서
      타이머가 통째로 미기동했다. 저작 머신은 ~/.claude 가 곧 repo 라
      드러나지 않았다.
    run: |
      grep -q '_resolve_aoa_mq_tick' "$REPO_DIR/services/hub/server.py" && echo ok
    expect: contains:ok

  - id: aoa-mq-due-transition
    desc: 예약 항목이 due 로 전이된다 (배관 실동작)
    why: |
      prj3#Issue476 — iso2epoch 가 BSD 전용이라 Linux 에서 0 을 반환했고,
      due 판정이 **영원히 성립하지 않았다.** 파싱만 보면 통과처럼 보이므로
      실제 전이까지 확인한다. 큐를 건드리지 않고 판정 로직만 태운다.
    run: |
      DATE=/bin/date
      past=$("$DATE" -v-1d '+%Y-%m-%dT%H:%M:%S' 2>/dev/null \
             || "$DATE" -d '-1 day' '+%Y-%m-%dT%H:%M:%S' 2>/dev/null)
      e=$("$DATE" -j -f '%Y-%m-%dT%H:%M:%S' "$past" +%s 2>/dev/null \
          || "$DATE" -d "$past" +%s 2>/dev/null || echo 0)
      now=$("$DATE" +%s)
      [ "$e" -gt 0 ] && [ "$e" -le "$now" ] && echo ok
    expect: contains:ok

  - id: hub-open-portable
    desc: hub 의 '열기' 가 플랫폼 분기를 갖는다
    why: |
      Issue432 — services/hub/server.py 가 subprocess.Popen(["open", …]) 를
      7곳에서 쓰는데 **플랫폼 분기가 0건**이다. `open` 은 macOS 전용이라
      Linux·Windows 에서 깨진다. cdf(Issue340)가 셸 함수는 고쳤으나 python
      서버는 손대지 않았다 — fg1 이 헤드리스라 드러나지 않았을 뿐,
      쓰는 순간 깨진다. Windows 이식의 선결 조건이다.
      해소(2026-08-30): `_open_cmd()` 로 분기 — macOS `open` / Linux `xdg-open`
      / Windows `cmd /c start`. 직접 호출 잔여 0건.
    run: |
      f="$REPO_DIR/services/hub/server.py"
      [ -f "$f" ] || { echo "skip(hub 미보유)"; exit 0; }
      n=$(grep -cE 'Popen\(\["open"' "$f")
      grep -q '_open_cmd' "$f" && [ "$n" = "0" ] && echo ok \
        || echo "open 직접 호출 ${n}곳 잔여"
    expect: contains:ok

  - id: claude-cli-available
    desc: claude CLI 가 있다 (플러그인·MCP 배선의 전제)
    why: |
      Issue433 — sh/install.sh 6·7단계가 `claude plugin`·`claude mcp` 를
      호출해 SCAR 와 MCP 서버를 배선한다. 즉 **Claude Code 는 선택이 아니라
      필수 전제**인데 INSTALL 요구사항 목록에 없었다(본문에 7번 언급되면서도).
      없으면 설치가 "성공" 하고 SCAR 만 통째로 빠진다.
      ⚠️ nvm 설치라면 hook·cron 에서 which 가 실패한다(prj3#Issue475) —
      관례 경로까지 훑는다.
    run: |
      command -v claude >/dev/null && echo ok && exit 0
      ls "$HOME"/.nvm/versions/node/*/bin/claude >/dev/null 2>&1 && echo ok && exit 0
      ls /usr/bin/claude /usr/local/bin/claude >/dev/null 2>&1 && echo ok || echo "MISSING"
    expect: contains:ok

  - id: process-mgmt
    desc: 프로세스 조회·종료 헬퍼가 실제로 동작한다
    why: |
      hub 재기동·좀비 정리가 여기 의존한다(설계 W6). 종전 케이스는 `windows.yml` 에서
      `pkill`·`pgrep`·`setsid` 의 **존재**만 물었고, Git Bash 에서 셋 다 부재라 FAIL 이었다
      (procps 미동봉). 그런데 정작 물어야 할 것은 *"이 저장소가 프로세스를 찾아 죽일 수
      있는가"* 다 — 게다가 `setsid` 는 이 저장소가 **한 곳도 쓰지 않는다**(백그라운드
      기동은 `nohup`). 쓰지도 않는 도구의 부재로 FAIL 을 내고 있었다.
      Issue437 이후 판정 대상은 `_fpm_pgrep`·`_fpm_pkill` 의 **계약**이다 — 조회→종료→
      소멸이 백엔드(procps·wmic·powershell)와 무관하게 같아야 한다. 그래서 이 케이스는
      Windows 전용이 아니라 core 다: macOS·Linux 에서 헬퍼가 깨지는 회귀도 같이 잡는다.
      ⚠️ 자기 명령줄을 매치하지 않도록 마커를 **런타임 확장값**(`$$` 포함)으로 만든다.
      케이스 원문에는 확장 전 문자열만 남아 러너 자신은 매칭되지 않는다 — 2026-08-30 에
      pkill 이 자기 ssh 셸을 먼저 죽여 뒤 명령이 통째로 누락된 적이 있다.
      (마커 스크립트의 자식 `sleep` 은 마커를 갖지 않아 판정과 무관하며 30초 뒤 자연 종료된다)
    run: |
      . "$REPO_DIR/sh/fpm_function.sh"
      b=$(_fpm_proc_backend)
      [ "$b" = none ] && { echo "FAIL backend=none"; exit 0; }
      m="fpmproc$$"; d=$(mktemp -d); s="$d/$m.sh"
      printf '#!/usr/bin/env bash\nsleep 30\n' > "$s"
      bash "$s" & sleep 2
      _fpm_pgrep "$m" >/dev/null || { echo "FAIL pgrep-0건 backend=$b"; rm -rf "$d"; exit 0; }
      _fpm_pkill "$m"           || { echo "FAIL pkill backend=$b"; rm -rf "$d"; exit 0; }
      sleep 1
      _fpm_pgrep "$m" >/dev/null && echo "FAIL 종료후생존 backend=$b" || echo "ok backend=$b"
      rm -rf "$d"
    expect: contains:ok

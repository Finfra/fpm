# Windows 전용 (Issue430)
#   ⚠️ 아직 실측하지 않았다 — Windows 머신 도입 시 이 파일부터 돌려
#      추정을 사실로 바꾼다. 지금은 **무엇을 확인해야 하는지의 목록**이다.
#   셸 전제: Git Bash / MSYS2 (POSIX 레이어). 네이티브 PowerShell 은 대상 아님.
cases:
  - id: shell-flavor
    desc: 어떤 POSIX 레이어에서 도는지 식별한다
    why: |
      MINGW64_NT / MSYS_NT / CYGWIN_NT 에 따라 경로 변환·심볼릭 링크·권한
      동작이 다르다. 무엇 위에서 도는지 모르면 나머지 판정이 의미가 없다.
    run: uname -s
    expect: nonempty

  - id: gnu-date-available
    desc: date 가 GNU 문법을 받는다
    why: |
      Git Bash 는 coreutils 를 동봉해 `date -d` 가 되지만 BSD `-j` 는 안 된다.
      core.yml 의 date-parse-iso 가 fallback 으로 통과하는지 함께 본다.
    run: date -d '2026-01-02T03:04:05' +%s
    expect: nonzero-epoch

  - id: path-separator
    desc: POSIX 경로가 그대로 통한다
    why: |
      Windows 는 C:\ 형식과 /c/ 형식이 공존한다. 스크립트가 만든 경로를
      python·git 이 그대로 받는지 확인해야 한다 — 여기서 갈리면 조용히
      "파일 없음" 이 되고 그것이 기능 미동작으로 나타난다.
    run: |
      python3 -c "import os,sys; print('ok' if os.path.isdir(sys.argv[1]) else 'FAIL')" "$REPO_DIR" 2>/dev/null \
        || python -c "import os,sys; print('ok' if os.path.isdir(sys.argv[1]) else 'FAIL')" "$REPO_DIR"
    expect: contains:ok

  - id: symlink-support
    desc: 심볼릭 링크를 만들 수 있다
    why: |
      설치 절차가 링크를 쓴다. Windows 는 개발자 모드 또는 관리자 권한이
      없으면 실패하고, 그 실패가 "설치됐는데 안 도는" 상태를 만든다.
    run: |
      t=$(mktemp -d); ln -s "$t" "$t/lnk" 2>/dev/null && echo ok; rm -rf "$t"
    expect: contains:ok

  - id: line-ending
    desc: 스크립트가 LF 로 유지된다
    why: |
      autocrlf 로 CRLF 가 섞이면 `#!/usr/bin/env bash` 가 깨져
      "bad interpreter" 로 죽는다. 배포된 셸 스크립트 전부의 문제가 된다.
    run: |
      f="$REPO_DIR/sh/check.sh"
      if command -v file >/dev/null; then file "$f" | grep -q CRLF && echo FAIL || echo ok
      else python3 -c "d=open('$f','rb').read(); print('FAIL' if b'\r\n' in d else 'ok')"; fi
    expect: contains:ok

  - id: process-mgmt
    desc: pkill/pgrep/setsid 가 동작한다
    why: |
      W6 — hub 재기동이 이 셋에 의존한다. Windows 의 프로세스 모델이 달라
      매칭이 빗나가면 재기동이 안 되거나 좀비가 남는다.
      ⚠️ 자기 명령줄을 매치하지 않도록 [s] 트릭을 쓴다 — 2026-08-30 에
      pkill 이 자기 ssh 셸을 먼저 죽여 뒤 명령이 통째로 누락된 적이 있다.
    run: |
      command -v pkill >/dev/null && command -v pgrep >/dev/null || { echo FAIL; exit 0; }
      sleep 30 & p=$!
      pgrep -f "[s]leep 30" >/dev/null && echo ok || echo FAIL
      kill $p 2>/dev/null
    expect: contains:ok

  - id: exec-permission
    desc: chmod +x 가 실제 실행 가능으로 이어진다
    why: |
      W7 — NTFS 는 POSIX 권한 비트가 없다. chmod 가 조용히 무시되면
      배포된 스크립트가 실행 불가이거나, 반대로 항상 실행 가능해진다.
    run: |
      t=$(mktemp -d); f="$t/x.sh"
      printf '#!/usr/bin/env bash\necho ok\n' > "$f"; chmod +x "$f"
      "$f" 2>/dev/null; rm -rf "$t"
    expect: contains:ok

  - id: case-fs-flavor
    desc: 파일시스템의 대소문자 성격을 기록한다 (정보성)
    why: |
      W8 — NTFS 는 기본 case-insensitive 다. 이는 **바꿀 수 없는 사실**이라
      FAIL 대상이 아니라 기록 대상이다. 실제 위험은 아래 case-collision 이 본다.
      ⚠️ 초판은 `expect: nonempty` 로 짜서 **어느 쪽이든 통과**했다 — macOS
      (insensitive)에서도 PASS 가 떠 판정이 없다는 걸 시뮬레이션이 잡아냈다.
    run: |
      t=$(mktemp -d); echo a > "$t/Aa"; echo b > "$t/aA" 2>/dev/null
      n=$(ls "$t" | wc -l | tr -d ' '); rm -rf "$t"
      [ "$n" = "2" ] && echo "case-sensitive" || echo "case-insensitive"
    expect: nonempty

  - id: case-collision
    desc: repo 에 대소문자만 다른 파일이 없다
    why: |
      W8 의 **진짜 위험**. case-insensitive 파일시스템에서 `Issue.md` 와
      `issue.md` 가 공존하는 repo 를 체크아웃하면 **하나가 조용히 사라지고**
      git 이 그것을 삭제·rename 으로 오인한다. 이 검사는 어느 OS 에서든
      유효하므로 **Windows 로 가기 전에 저작 머신에서 미리** 잡을 수 있다.
    run: |
      n=$(git -C "$REPO_DIR" ls-files | tr 'A-Z' 'a-z' | sort | uniq -d | wc -l | tr -d ' ')
      [ "$n" = "0" ] && echo ok || { echo "충돌 ${n}건:"; \
        git -C "$REPO_DIR" ls-files | tr 'A-Z' 'a-z' | sort | uniq -d | head -5; }
    expect: contains:ok

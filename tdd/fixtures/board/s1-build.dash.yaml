# s1 대량 순차 파일 생성 — 순수 모니터링 + 합성 worker (축약: 10개). @ROOT@·@WORKER_PID@ 는 하네스가 채운다
title: s1-build
status: init
worker_pid: @WORKER_PID@
widgets:
- id: progress
  type: progress
  title: 생성 진행률
  dynamic_eval: "echo $(( $(ls @ROOT@/out | wc -l) * 10 ))"
- id: count
  type: text
  title: 생성 수
  dynamic_eval: "ls @ROOT@/out | wc -l | tr -d ' '"

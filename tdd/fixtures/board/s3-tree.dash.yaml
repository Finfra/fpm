# s3 이슈 의존 트리 — 정적 graph(tree). runner 왕복 후에도 authoring(type·width)이 보존돼야 한다
title: s3-tree
status: init
widgets:
- id: issue-tree
  type: tree
  title: 이슈 트리
  width: 2
  nodes:

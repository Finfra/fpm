# s8 정기 작업 스케줄 — infinite heartbeat + table(예정/완료/다음). worker_pid 키 없음
title: s8-schedule
status: init
widgets:
- id: schedule
  type: table
  title: 스케줄
  width: 2
  columns: [작업, 예정, 완료, 다음]
  dynamic_eval: "echo x >> @ROOT@/s8.ticks; printf '[[\"backup\",\"02:00\",\"%s\",\"03:00\"]]' $(wc -l < @ROOT@/s8.ticks | tr -d ' ')"
- id: due
  type: badge
  title: 다음 실행
  label: '03:00'
  state: pending

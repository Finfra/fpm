# s7 주기적 모니터링 — infinite heartbeat. worker_pid 키를 **넣지 않는다**(board-scenario-kit 교훈 3)
title: s7-health
status: init
widgets:
- id: health
  type: text
  title: 헬스
  dynamic_eval: "echo x >> @ROOT@/s7.ticks; echo alive-$(wc -l < @ROOT@/s7.ticks | tr -d ' ')"
- id: health-log
  type: log
  title: 누적 로그
  width: full
  dynamic_eval: "tail -5 @ROOT@/s7.ticks"

# L3 실 worker E2E — s4 축약 3단계 선형 큐 (tdd/board-real-worker.sh 전용)
# 실 claude worker 가 파일을 만들고 sentinel 로 완료를 보고한다. r2 는 r1 결과를 {{r1.result}} 로 받는다
title: real-worker
state: running
on_fail: halt
concurrency: 1
items:
- id: r1
  prj: 1
  issue: 1
  depends: []
  status: ready
  attempts: 0
  prompt: "이 폴더에 step1.txt 파일을 만들고 내용으로 one 한 줄만 쓰세요 (Bash: printf 'one\\n' > step1.txt). 그 밖의 작업은 하지 마세요."
- id: r2
  prj: 1
  issue: 2
  depends: [r1]
  status: blocked
  attempts: 0
  prompt: "앞 단계 결과 요약: {{r1.result}} — 이 폴더에 step2.txt 파일을 만들고 내용으로 two 한 줄만 쓰세요 (Bash: printf 'two\\n' > step2.txt). 그 밖의 작업은 하지 마세요."
- id: r3
  prj: 1
  issue: 3
  depends: [r2]
  status: blocked
  attempts: 0
  prompt: "이 폴더의 step1.txt 와 step2.txt 내용을 읽어, 두 내용을 공백 하나로 이은 문자열(one two)을 이번 작업의 결과 요약으로 보고하세요. 파일은 만들지 마세요."
